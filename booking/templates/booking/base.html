<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ресторан{% endblock %}</title>
    <!-- Подключаем Bootstrap (CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Подключаем иконки Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Навигационное меню -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Мой Ресторан</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about/">О нас</a></li>
                    <li class="nav-item"><a class="nav-link" href="/book/">Бронирование</a></li>

                    {% if user.is_authenticated %}
                        <li class="nav-item"><a class="nav-link" href="/my-bookings/">Мои брони</a></li>
                        <li class="nav-item"><span class="nav-link text-light">Привет, {{ user.username }}</span></li>
                        <li class="nav-item"><a class="nav-link" href="/logout/">Выйти</a></li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="/login/">Войти</a></li>
                        <li class="nav-item"><a class="nav-link" href="/register/">Регистрация</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основной контент (сюда будут вставляться другие страницы) -->
    <div class="container mt-4 flex-grow-1">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Подвал сайта -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2024 Мой Ресторан. Все права защищены.</p>
    </footer>

    <!-- Подключаем Bootstrap (JS) для работы меню на телефонах -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
